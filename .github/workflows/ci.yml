name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (migrations + pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: taskflow_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: taskflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskflow_user -d taskflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://taskflow_user:ci_password@localhost:5432/taskflow
      TEST_DATABASE_URL: postgresql+psycopg://taskflow_user:ci_password@localhost:5432/taskflow_test
      JWT_SECRET_KEY: ci-only-secret-key-not-used-anywhere-else
      PGPASSWORD: ci_password
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Apply migrations to a fresh database
        run: alembic upgrade head
      - name: Check models and migrations are in sync
        run: alembic check
      - name: Create test database
        run: psql -h localhost -U taskflow_user -d taskflow -c "CREATE DATABASE taskflow_test"
      - name: Run tests
        run: pytest -v

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
